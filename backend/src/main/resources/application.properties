# ==============================================================================
# STUDENT MANAGEMENT SYSTEM - APPLICATION CONFIGURATION
# ==============================================================================
spring.application.name=student-management-system
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# Database Configuration
# Default to H2 for local development so the app runs without a separate PostgreSQL instance.
# Override with DB_URL / DB_USERNAME / DB_PASSWORD when using Neon or a local PostgreSQL server.
# DB_DRIVER and DB_DIALECT switch the H2 defaults to PostgreSQL.
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:sms_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------------------
# HikariCP configuration for local development
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.pool-name=LocalHikariPool

# ------------------------------------------------------------------------------
# Hibernate / JPA Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# JWT Authentication Settings
# ------------------------------------------------------------------------------
# Default secret is a 256-bit hex key for dev; override in production via JWT_SECRET
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# ------------------------------------------------------------------------------
# CORS Configuration
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000}

# ------------------------------------------------------------------------------
# Initial Super Admin Seed Credentials
# ------------------------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL:admin@sms.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.sms.studentmanagementsystem=INFO
logging.level.org.springframework.security=WARN
